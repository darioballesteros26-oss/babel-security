name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Descargar PDFium (macOS arm64)
        run: |
          mkdir -p src-tauri/binaries/pdfium
          curl -sL https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7961/pdfium-mac-arm64.tgz -o /tmp/pdfium.tgz
          tar xzf /tmp/pdfium.tgz -C /tmp lib/libpdfium.dylib
          cp /tmp/lib/libpdfium.dylib src-tauri/binaries/pdfium/

      - name: Instalar dependencias npm
        run: npm ci

      - name: Build Mac (.dmg) firmado para auto-update
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generar latest.json
        run: |
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          SIG="${DMG}.sig"
          if [ ! -f "$SIG" ]; then
            echo "✗ No se generó la firma .sig — verifica que TAURI_SIGNING_PRIVATE_KEY está configurado en los Secrets del repositorio."
            exit 1
          fi
          FIRMA=$(cat "$SIG")
          FECHA=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          VER_NUM="${GITHUB_REF_NAME#v}"
          DMG_NOMBRE=$(basename "$DMG" | sed 's/ /%20/g')
          REPO="darioballesteros26-oss/babel-security"
          cat > latest.json <<EOF
          {
            "version": "$VER_NUM",
            "notes": "Ver notas en https://github.com/$REPO/releases/tag/$GITHUB_REF_NAME",
            "pub_date": "$FECHA",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$FIRMA",
                "url": "https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/$DMG_NOMBRE"
              }
            }
          }
          EOF
          echo "latest.json generado:"
          cat latest.json

      - name: Subir artifacts Mac
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            latest.json

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      # El sidecar servidor_babel es un binario macOS — en Windows se omite.
      # La app Windows usa el servidor Python externo lanzado por LANZAR_BABEL.bat.
      - name: Parchear tauri.conf.json — quitar externalBin en Windows
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $conf.bundle.PSObject.Properties.Remove('externalBin')
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

      - name: Descargar PDFium (Windows x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries/pdfium | Out-Null
          Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7961/pdfium-win-x64.tgz" -OutFile pdfium.tgz
          tar xzf pdfium.tgz bin/pdfium.dll
          Copy-Item bin/pdfium.dll src-tauri/binaries/pdfium/

      - name: Instalar dependencias npm
        run: npm ci

      - name: Build Windows (.msi + setup.exe)
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Subir instaladores Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar artifacts Mac
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: dist/mac

      - name: Descargar artifacts Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: dist/win

      - name: Crear GitHub Release y subir instaladores
        uses: softprops/action-gh-release@v2
        with:
          name: "Babel Security ${{ github.ref_name }}"
          body: |
            ## Babel Security ${{ github.ref_name }}

            ### Descargas

            | Plataforma | Archivo |
            |---|---|
            | macOS (Apple Silicon) | `Security Babel_*_aarch64.dmg` |
            | Windows (64-bit) | `Security Babel_*_x64-setup.exe` o `.msi` |

            ### Instalación Mac
            1. Descarga el `.dmg` y ábrelo
            2. Arrastra **Security Babel** a Aplicaciones
            3. En el primer arranque: clic derecho → Abrir (para pasar Gatekeeper)

            ### Instalación Windows
            1. Descarga el `.exe` (NSIS) o `.msi`
            2. Ejecuta el instalador como administrador
            3. Abre **Security Babel** desde el menú inicio
          files: |
            dist/mac/*.dmg
            dist/mac/latest.json
            dist/win/*.msi
            dist/win/*.exe
          draft: false
          prerelease: false
