name: Security Audit
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # cada lunes

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
